[package]
name = "pdf-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "PDF engine for Folio: PDFium wrapper without any UI dependency"

[dependencies]
# PDFium runs on a single worker thread (see lib.rs), so the crate's
# `thread_safe` mutex wrapper and the `image` integration are not needed.
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# Pure-Rust decoders only (no GPL/native deps); EXIF orientation is applied on open.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
