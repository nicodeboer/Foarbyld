name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Fetch PDFium and create test PDF
        run: |
          node scripts/fetch-pdfium.mjs
          node scripts/make-test-pdf.mjs

      - name: Test pdf-core against real PDFium
        shell: bash
        env:
          RUST_BACKTRACE: 1
        run: |
          export PDFIUM_LIB_DIR="$PWD/src-tauri/resources/pdfium"
          export TEST_PDF="$PWD/testdata/200-pages.pdf"
          cargo test -p pdf-core -- --nocapture

  app:
    name: Build app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/fetch-pdfium.mjs

      - name: Build bundles
        run: npm run tauri -- build

      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.msi
            target/release/bundle/**/*-setup.exe
          if-no-files-found: warn
