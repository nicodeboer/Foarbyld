name: Release

# Push a tag like v0.1.0 to build installers and attach them to a draft GitHub release.
#   git tag -a v0.1.0 -m "Foarbyld 0.1.0" && git push origin v0.1.0
# Review the draft on GitHub, then publish it. Tags containing a hyphen
# (v0.2.0-rc1) are marked as pre-releases.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-latest
          # macos-latest is Apple Silicon; fetch-pdfium picks the arm64 dylib from the host arch.
          - os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::Tag v$tag does not match the versions in tauri.conf.json / package.json / Cargo.toml"
            exit 1
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/fetch-pdfium.mjs

      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Foarbyld ${{ github.ref_name }}
          releaseBody: |
            Prototype build. See the assets below for Linux (.deb, .rpm, .AppImage), Windows (.msi, .exe)
            and macOS (.dmg, Apple Silicon only).
            These builds are unsigned. The macOS app is only ad-hoc signed and not notarized:
            on first launch right-click the app and choose Open (or run `xattr -cr Foarbyld.app`).
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
