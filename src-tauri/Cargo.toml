[package]
name = "foarbyld"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Foarbyld: a cross-platform document and image previewer"

[lib]
name = "foarbyld_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
pdf-core = { path = "../crates/pdf-core" }
md-core = { path = "../crates/md-core" }
